# ==========================================
# CẤU HÌNH TIẾT KIỆM PIN CỰC ĐẠI CHO THINKPAD
# ==========================================

TLP_ENABLE=1

# CPU Scaling & EPP
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# QUAN TRỌNG: Tắt Turbo Boost khi rút sạc (tiết kiệm 40-50% điện CPU)
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# HWP Dynamic Boost
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Giới hạn xung GPU Intel khi dùng pin
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_BAT=750
INTEL_GPU_BOOST_FREQ_ON_BAT=800

# Tiết kiệm điện PCIe Bus (ASPM)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Quản lý điện năng SATA
SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=med_power_with_dipm

# TỐI ƯU NĂNG LƯỢNG ÂM THANH AN TOÀN (AN TOÀN CHO CONEXANT CX11880):
# Cho phép chip giải mã âm thanh DAC ngủ sâu sau 1 giây ngưng phát khi dùng pin
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
# BẮT BUỘC giữ = N để không ngắt PCI controller, chống mất kết nối loa/PipeWire
SOUND_POWER_SAVE_CONTROLLER=N

# Wi-Fi Power Save
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# USB Autosuspend
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1

# Tắt Bluetooth khi khởi động dùng pin nếu không dùng
DEVICES_TO_DISABLE_ON_BAT_START="bluetooth"
