<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <match target="font">
  <!-- Bật khử răng cưa -->
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
  <!-- Bật hiển thị dạng subpixel RGB -->
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
  <!-- Bật Hinting để định hình ký tự rõ nét -->
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
  <!-- Hintstyle: Chọn 'hintslight' để nét mượt hoặc 'hintfull' để nét đanh như Windows -->
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
  <!-- Bộ lọc LCD chống viền màu -->
  <edit mode="assign" name="lcdfilter">
   <const>lcddefault</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
